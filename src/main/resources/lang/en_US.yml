# EnthusiaKOTH — en_US locale.
# All values are MiniMessage strings unless marked as <legacy>.
# Placeholders use <name> syntax, e.g. <player>, <koth>, <amount>, <state>.
#
# § codes are ALSO accepted for compatibility.

prefix: "<gradient:#FF7272:#FFC976><shadow:#000000:1>[Koth]</shadow></gradient> "

command:
  help:
    header: "<shadow:#000000:1><prefix><dark_red><bold>EnthusiaKOTH</bold> <dark_gray>Commands"
    gui: "<prefix><green>/ekoth gui <gray>- Open KOTH GUI"
    schedule: "<prefix><green>/ekoth schedule <gray>- Show KOTH schedule"
    top: "<prefix><green>/ekoth top [page] <gray>- KOTH leaderboard"
    stats: "<prefix><green>/ekoth stats [player] <gray>- Your KOTH stats"
    start: "<prefix><red>/ekoth start <arena> <gray>- Start a KOTH"
    stop: "<prefix><red>/ekoth stop <gray>- Force-end active KOTH"
    cancel: "<prefix><red>/ekoth cancel <gray>- Force-end active KOTH"
    giveflare: "<prefix><red>/ekoth giveflare <player> <arena> [amount] <gray>- Give flare"
    reload: "<prefix><red>/ekoth reload <gray>- Reload config"
    status: "<prefix><green>/ekoth status <gray>- Show server status"
    lock: "<shadow:#000000:1><prefix><green>/ekoth lock <unlocked|manual_locked|all_locked> <gray>- Set lock state"
    private_usage: "<prefix><red>/ekoth private <start|join|leave|cancel> [arena]"

  success:
    started: "<prefix><green>Started the <yellow><arena> <green>koth."
    ended: "<prefix><green>Ended the active koth."
    started_from_gui: "<prefix><green>Started <yellow><arena> <green>from the GUI."

  error:
    no_permission: "<prefix><red>You don't have permission."
    no_permission_start: "<prefix><red>You don't have permission to start KOTHs."
    not_a_player: "<prefix><red>Only players can use this."
    player_not_found: "<prefix><red>Player not found."
    koth_not_found: "<prefix><red>That KOTH doesn't exist. Available: <koths>"
    koth_not_found_short: "<prefix><red>KOTH doesn't exist."
    already_active: "<prefix><red>A KOTH is already active!"
    locked: "<prefix><red>Cannot start KOTH — check lock state."
    no_active: "<prefix><red>No active KOTH."
    stats_self: "<prefix><green>You have won <yellow><wins> <green>koths."
    stats_other: "<prefix><yellow><player> <green>has won <yellow><wins> <green>koths."
    flare_given: "<prefix><green>Gave <yellow><player> <amount> <yellow><koth> <green>koth flares."
    flare_received: "<prefix><green>You received <amount> <yellow><koth> <green>koth flares!"
    reloaded: "<prefix><green>Configuration reloaded."
    arena_not_found: "<prefix><red>Arena not found. Available: <koths>"
    invalid_lock: "<prefix><red>Invalid lock state. Valid: <states>"
    lock_set: "<prefix><green>Lock set to <yellow><state>."
    no_guild: "<prefix><red>You must be in a guild to start a paid KOTH."
    insufficient_funds: "<prefix><red>Your guild needs <yellow><cost> <red>to start this KOTH (balance: <yellow><balance><red>)."
    payment_failed: "<prefix><red>Payment failed — KOTH not started."

  status:
    line: "<shadow:#000000:1><gray><strikethrough>----------------------------------------</strikethrough>"
    header: "<shadow:#000000:1><gold><bold>EnthusiaKOTH Status"
    lock: "<shadow:#000000:1><gray>Lock: <state>"
    active: "<shadow:#000000:1><gray>Active: <arena>"
    capper: "<shadow:#000000:1><gray>  Capper: <green><capper>"
    time_left: "<shadow:#000000:1><gray>  Time left: <green><time>"
    next_scheduled: "<shadow:#000000:1><gray>Next scheduled: <green><time>"

  schedule:
    header: "<shadow:#000000:1><strikethrough>-----</strikethrough><green><bold>Koth Schedule</bold><strikethrough>-----</strikethrough>"
    time_now: "<shadow:#000000:1><red>Time Now: <yellow><time>"
    timezone: "<shadow:#000000:1><red>TimeZone: <yellow><zone>"
    entry: "<shadow:#000000:1><green><name>"
    entry_time: "<shadow:#000000:1>  <dark_gray>- <green><time>"

  top:
    header: "<shadow:#000000:1><gold><bold>KOTH Leaderboard"
    entry: "<shadow:#000000:1><yellow><rank>. <gray><player> <dark_gray>- <white><wins> wins"

  gui:
    title: "<shadow:#000000:1><dark_green><bold>KOTHs"
    item_name_active: "<shadow:#000000:1><green><id>"
    item_name_inactive: "<shadow:#000000:1><gray><id>"
    lore_active_yes: "<shadow:#000000:1><dark_gray>* <white>Active: <green><status>"
    lore_active_no: "<shadow:#000000:1><dark_gray>* <white>Active: <red><status>"
    lore_capturing_yes: "<shadow:#000000:1><dark_gray>* <white>Capturing: <green><capper>"
    lore_capturing_no: "<shadow:#000000:1><dark_gray>* <white>Capturing: <gray><capper>"
    lore_time_left_yes: "<shadow:#000000:1><dark_gray>* <white>Time Left: <green><time>"
    lore_time_left_no: "<shadow:#000000:1><dark_gray>* <white>Time Left: <gray><time>"

private:
  usage: "<prefix><red>/ekoth private <start|join|leave|cancel> [arena]"
  error:
    not_player: "<prefix><red>Only players can use this."
    arena_not_found: "<prefix><red>Arena not found. Available: <koths>"
    already_active: "<prefix><red>A KOTH is already active!"
    locked: "<prefix><red>Cannot start private test — check lock state."
    no_active: "<prefix><red>There is no active private KOTH to join."
    not_private: "<prefix><red>The current KOTH is not a private test."
    expired: "<prefix><red>This private KOTH is no longer accepting participants."
    is_owner: "<prefix><red>You are the owner of this private KOTH."
    already_joined: "<prefix><red>You are already in this private KOTH."
    not_in_private: "<prefix><red>You are not in a private KOTH."
    owner_cancel: "<prefix><red>The owner must use /ekoth private cancel instead."
    no_private_active: "<prefix><red>You do not have an active private KOTH."
    cancelled_active: "<prefix><red>Your private KOTH has been cancelled."
  success:
    joined: "<prefix><green>Joined the private KOTH!"
    left: "<prefix><green>Left the private KOTH."
    cancelled: "<prefix><green>Your private KOTH has been cancelled."
  lobby_open: "<prefix><green>Private KOTH lobby open! <yellow>/lobby <green>to join. Starting in <yellow><seconds>s."
  started: "<prefix><green>Private KOTH started! Quick match: <duration>s, capture: <capture>s."
  objective_particles: "<shadow:#000000:1><gray>Follow the particles to the objective!"

koth:
  enter: "<prefix><green><entered> entered the <yellow><koth_name><green> koth! Cap in <captime>!"
  leave: "<prefix><green><left> left the <yellow><koth_name><green> koth! <time_left> left!"
  capping: "<prefix><green><capping> is capturing the <yellow><koth_name><green> koth! <time_left> left!"
  capture: "<prefix><green><captured> captured the <yellow><koth_name><green> koth!"
  begin: "<prefix><green><koth_name> has begun! Location: <yellow><location>"
  ended: "<prefix><red>The koth <yellow><koth_name><red> has been forcefully ended!"
  ended_first_capture: "<prefix><red>The koth <yellow><koth_name><red> has ended — first capture! Congratulations <player>!"
  no_captures: "<prefix><red>No captures were made during that KOTH."
  warning_minutes: "<prefix><green><koth_name> <green>starts in <minutes> minutes!"
  reminder: "<prefix><green>Reminder that the <yellow><koth_name><green> koth is still active! <capper> <dark_gray>(<time_left>)</dark_gray> is currently capturing."

protection:
  no_break: "<shadow:#000000:1><red>You cannot break blocks inside the active KOTH zone!"
  no_place: "<shadow:#000000:1><red>You cannot place blocks inside the active KOTH zone!"
  protected: "<shadow:#000000:1><red>This KOTH arena is protected."

flare:
  not_in_region: "<prefix><red>You must be on the <yellow><koth> <red>capture point to use the flare!"
  already_active: "<prefix><red>The <yellow><koth> <red>koth is already active."
  started: "<prefix><green>Started the <yellow><koth> <green>koth with your flare."
  started_broadcast: "<prefix><yellow><player> <green>started the <yellow><koth> <green>koth with a flare! Go to <yellow><location><green>!"

bossbar:
  format_with_capper: "<shadow:#000000:1><gold><bold><koth_name> <dark_gray>|<green><capper><contested> <dark_gray>|<gray><time>"
  format_no_capper: "<shadow:#000000:1><gold><bold><koth_name> <dark_gray>|<gray><time>"
  contested: "<shadow:#000000:1><red> ⚔"

progress_bar:
  format: "<shadow:#000000:1><red>KOTH Progress: <dark_gray>[<progress_bar><dark_gray>]"
  empty_color: "<shadow:#000000:1><gray>"
