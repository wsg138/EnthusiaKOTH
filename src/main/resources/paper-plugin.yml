name: EnthusiaKOTH
version: '0.2.0'
main: net.badgersmc.ek.EnthusiaKothPlugin
api-version: '1.21'
authors: [BadgersMC]
description: Modular KOTH framework for Enthusia, powered by Nexus.

dependencies:
  server:
    LumaGuilds:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  enthusiakoth.command:
    default: true
    description: Use the /ekoth command
  enthusiakoth.player:
    default: true
    description: Standard player KOTH permissions
    children:
      enthusiakoth.command: true
      enthusiakoth.start.basic: true
      enthusiakoth.flare.use: true
  enthusiakoth.admin:
    default: op
    description: Administrative KOTH commands and maintenance
    children:
      enthusiakoth.command: true
      enthusiakoth.start.advanced: true
      enthusiakoth.flare.use: true
      enthusiakoth.privatetest: true
      enthusiakoth.protection.bypass: true
  enthusiakoth.start.basic:
    default: true
    description: Start a player-paid KOTH at the basic configured cost
  enthusiakoth.start.advanced:
    default: op
    description: Start a player-paid KOTH at the advanced configured cost
    children:
      enthusiakoth.start.basic: true
  enthusiakoth.flare.use:
    default: true
    description: Use KOTH flare items
  enthusiakoth.privatetest:
    default: op
    description: Start or cancel approved private KOTH tests
  enthusiakoth.protection.bypass:
    default: op
    description: Perform intentional player maintenance inside protected KOTH regions
