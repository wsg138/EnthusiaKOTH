config-version: 5

general:
  timezone: "America/New_York"
  manual-start-delay-seconds: 0

locks:
  state: "UNLOCKED"

manual-start:
  basic-cost: 0.0
  advanced-cost: 0.0

private-testing:
  lobby-seconds: 0
  quick-match-duration-seconds: 120
  quick-capture-seconds: 15
  show-objective-particles: true

schedule:
  enabled: false
  pre-start-warning-seconds: 300
  times:
    - "00:00"
    - "08:00"
    - "16:00"

storage:
  stats-file: "stats.yml"

discord:
  enabled: false
  webhook-url: ""
  pre-start-ping-minutes: 10
  live-update-seconds: 60

arenas:
  capture:
    enabled: true
    world: "world"
    center: { x: 0.5, y: 80.0, z: 0.5 }
    protected-region:
      corner-1: { x: -32.0, y: -64.0, z: -32.0 }
      corner-2: { x: 32.0, y: 320.0, z: 32.0 }
    radius: 5.0
    duration-seconds: 900
    capture-seconds: 120
    leave-behavior: "RESET"
    decay-per-second: 1.0
  moving:
    enabled: true
    world: "world"
    center: { x: 40.5, y: 80.0, z: 40.5 }
    protected-region:
      corner-1: { x: 8.5, y: -64.0, z: 8.5 }
      corner-2: { x: 72.5, y: 320.0, z: 72.5 }
    radius: 5.0
    duration-seconds: 900
    square-size: 20.0
    speed-blocks-per-second: 1.0
  conquest:
    enabled: false
    protected-region:
      corner-1: { x: -48.0, y: -64.0, z: -48.0 }
      corner-2: { x: 48.0, y: 320.0, z: 48.0 }
    duration-seconds: 1200
    max-extensions: 10
    extension-seconds: 60

rewards:
  capture:
    solo-vault-money: 0.0
    guild-vault-money: 0.0
  moving:
    solo-vault-money: 0.0
    guild-vault-money: 0.0
  conquest:
    solo-vault-money: 0.0
    guild-vault-money: 0.0

rules:
  defaults:
    capture:
      elytra: true
      mace: "FULLY_ALLOWED"
      spear: true
      ender-pearl: true
      wind-charge: true
      mace-cooldown-seconds: 0
      spear-cooldown-seconds: 0
      ender-pearl-cooldown-seconds: 0
      wind-charge-cooldown-seconds: 0
    moving:
      elytra: true
      mace: "FULLY_ALLOWED"
      spear: true
      ender-pearl: true
      wind-charge: true
      mace-cooldown-seconds: 0
      spear-cooldown-seconds: 0
      ender-pearl-cooldown-seconds: 0
      wind-charge-cooldown-seconds: 0
    conquest:
      elytra: true
      mace: "FULLY_ALLOWED"
      spear: true
      ender-pearl: true
      wind-charge: true
      mace-cooldown-seconds: 0
      spear-cooldown-seconds: 0
      ender-pearl-cooldown-seconds: 0
      wind-charge-cooldown-seconds: 0

conquest:
  capture-speed-bonuses:
    1: 0.20
    2: 0.35
    3: 0.55
    4: 0.75
    5: 0.85
    6: 0.90
