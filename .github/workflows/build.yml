name: Build

on:
  push:
    branches:
      - main
      - 'repair/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Clean, test, and build shadow JAR
        run: |
          chmod +x gradlew
          ./gradlew clean test shadowJar --no-daemon

      - name: Inspect test reports and runtime dependency graph
        run: |
          test -f build/reports/tests/test/index.html
          ./gradlew dependencies --configuration runtimeClasspath --no-daemon > build/runtime-dependencies.txt

      - name: Inspect exact shadow JAR
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' | sort | tail -n 1)"
          test -n "$JAR"
          echo "JAR=$JAR" | tee build/jar-details.txt
          sha256sum "$JAR" | tee -a build/jar-details.txt
          unzip -Z1 "$JAR" > build/jar-contents.txt
          test "$(grep -c '^paper-plugin.yml$' build/jar-contents.txt)" -eq 1
          if grep -Eq '^(org/bukkit|io/papermc|net/lumalyte/lg/api|net/milkbowl/vault)/' build/jar-contents.txt; then
            echo 'Server-provided API classes were packaged unexpectedly.' >&2
            exit 1
          fi
          DUPLICATES="$(sort build/jar-contents.txt | uniq -d)"
          if [ -n "$DUPLICATES" ]; then
            printf 'Duplicate JAR entries:\n%s\n' "$DUPLICATES" >&2
            exit 1
          fi
          unzip -p "$JAR" paper-plugin.yml > build/paper-plugin-from-jar.yml

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EnthusiaKOTH-${{ github.sha }}
          path: |
            build/libs/*-all.jar
            build/reports/tests/test/
            build/test-results/test/
            build/runtime-dependencies.txt
            build/jar-details.txt
            build/jar-contents.txt
            build/paper-plugin-from-jar.yml
          if-no-files-found: warn
